name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer
        pip install cython
        pip install kivy
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools: '33.0.0'
        ndk: '29.0.13846066'
        sdk: 'commandlinetools'
    - name: Install SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "build-tools;33.0.0" "platform-tools" "platforms;android-33"
        if [ ! -d "$ANDROID_HOME/ndk/29.0.13846066" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "ndk;29.0.13846066"
        fi
    - name: Configure SDK for Buildozer
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        cp -r $ANDROID_HOME/cmdline-tools/latest/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
        cp -r $ANDROID_HOME/build-tools/33.0.0 $HOME/.buildozer/android/platform/android-sdk/build-tools/
        cp -r $ANDROID_HOME/platform-tools $HOME/.buildozer/android/platform/android-sdk/platform-tools/
        cp -r $ANDROID_HOME/platforms/android-33 $HOME/.buildozer/android/platform/android-sdk/platforms/
        if [ -d "$ANDROID_HOME/ndk/29.0.13846066" ]; then
          cp -r $ANDROID_HOME/ndk/29.0.13846066 $HOME/.buildozer/android/platform/android-sdk/ndk/
        else
          echo "NDK 29.0.13846066 not found, using latest available NDK"
          cp -r $ANDROID_HOME/ndk/* $HOME/.buildozer/android/platform/android-sdk/ndk/
        fi
        export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
        export ANDROIDNDK=$HOME/.buildozer/android/platform/android-sdk/ndk/29.0.13846066
        echo "ANDROIDSDK=$ANDROIDSDK" >> $GITHUB_ENV
        echo "ANDROIDNDK=$ANDROIDNDK" >> $GITHUB_ENV
        # Crear buildozer.spec con expansión de variables
        cat > $HOME/.buildozer/android/platform/buildozer.spec << EOF
[app]
title = My Application

[buildozer]
android.skip_sdk_update_on_install = 1
android.sdk_path = $ANDROIDSDK
android.ndk_path = $ANDROIDNDK
android.use_cmdlinetools = 1
EOF
        # Verificar que el archivo se creó correctamente
        if [ -f "$HOME/.buildozer/android/platform/buildozer.spec" ]; then
          echo "buildozer.spec created successfully"
          cat $HOME/.buildozer/android/platform/buildozer.spec
        else
          echo "Error: buildozer.spec was not created"
          exit 1
        fi
    - name: Build APK
      run: |
        buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/carpetaapp-*.apk
