name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer
        pip install cython
        pip install kivy
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools: '33.0.0'
        ndk: '29.0.13846066'
        sdk: 'commandlinetools'
    - name: Install SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" "platform-tools" "platforms;android-33"
    - name: Configure Buildozer SDK
      run: |
        # Crear la estructura de directorios esperada por Buildozer
        mkdir -p $HOME/.buildozer/android/platform
        # Copiar todo el SDK a la ubicación de Buildozer
        cp -r $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk
        # Establecer variables de entorno
        echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-sdk/ndk/29.0.13846066" >> $GITHUB_ENV
    - name: Build APK
      run: |
        buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/carpetaapp-*.apk
